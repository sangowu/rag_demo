chunking:
  chunk_size: 1024
  overlap: 128
  strategy: "fixed"  # 可选: "fixed", "recursive", "semantic"
  # SemanticChunker 调用 embed_documents 时按批编码，避免整页句子一次前向 OOM
  semantic_embed_batch_size: 8

vector_store:
  pg_dsn: "${PG_DSN}"
  embedding_model: "BAAI/bge-m3"
  embedding_model_path: "./models/BAAI/bge-m3"
  embedding_server_url: "http://localhost:6006"          # 填入后走远程 embedding server，留空则本地加载模型
  embed_batch_size: 16
  embed_max_token: 8192
  store_sparse: false              # sparse_weights JSONB 列（已弃用，保留字段供后续扩展）
  hnsw_m: 16
  hnsw_ef_construction: 64
  hnsw_ef_search: 100

bm25:
  index_path: "data/bm25_index.pkl"

retriever:
  top_k: 5
  candidate_k: 50                  # rerank 前的候选数量（dense + BM25 各取此数量）
  rrf_k: 60                        # RRF 平滑常数，标准默认值

llm:
  model: "gemini-3.1-flash-lite-preview"
  api_key_env: "GOOGLE_API_KEY"
  temperature: 0.1
  max_tokens: 1024

llm_qa_gen:
  temperature: 0.7
  max_tokens: 512

reranker:
  model_path: "./models/BAAI/bge-reranker-v2-m3"

agent:
  max_retries: 2                   # Reflector 最大重试次数

semantic_cache:
  threshold: 0.92                  # 余弦相似度阈值，超过则命中缓存
  max_size: 1000                   # 最大缓存条目数（FIFO 淘汰）

guardrails:
  enabled: true                    # 是否启用输入/输出校验


