services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data       # BM25 索引持久化
      - ./models:/app/models   # 本地模型复用，避免重复下载
    environment:
      - MODELSCOPE_API_KEY=${MODELSCOPE_API_KEY}
      - PG_DSN=postgresql://rag:rag@postgres:5432/ragdb
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
